<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Segway ZT3 Dashboard</title>
  <style>
    :root{
      --bg:#000;
      --fg:#fff;
      --muted:#bdbdbd;
      --accent:#00e676;
      --danger:#ff5252;
      --panel:#111;
    }
    html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:Inter,Segoe UI,Roboto,Arial,sans-serif}
    .app{display:flex;flex-direction:column;height:100%}
    header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:linear-gradient(180deg,#0b0b0b,#111);border-bottom:1px solid #222}
    header h1{font-size:18px;margin:0;font-weight:600}
    .controls{display:flex;gap:8px;align-items:center}
    button{background:#222;color:var(--fg);border:1px solid #333;padding:8px 12px;border-radius:8px;cursor:pointer}
    button.primary{background:var(--accent);color:#000;border:none}
    .banner{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(255,255,255,0.02);border-bottom:1px solid #222}
    .status-dot{width:12px;height:12px;border-radius:50%}
    .status-text{font-weight:600}
    main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px}
    .speed{font-size:96px;font-weight:800;letter-spacing: -2px}
    .unit{font-size:20px;color:var(--muted);margin-top:6px}
    .row{display:flex;gap:20px;align-items:center;margin-top:28px}
    .card{background:var(--panel);padding:12px;border-radius:12px;min-width:180px}
    .battery-bar{width:220px;height:14px;background:#222;border-radius:8px;overflow:hidden}
    .battery-fill{height:100%;background:linear-gradient(90deg,var(--accent),#66ffa6);width:0%}
    .temp-box{padding:8px 12px;border-radius:8px;background:#0f0f0f;text-align:center}
    .small{font-size:13px;color:var(--muted)}
    footer{padding:10px 16px;text-align:center;color:var(--muted);font-size:13px}
    .warning{color:var(--danger);font-weight:700}
    .toggle{display:flex;align-items:center;gap:8px}
    .hidden{display:none}
    @media (max-width:520px){
      .speed{font-size:64px}
      .battery-bar{width:160px}
    }
  </style>
</head>
<body>
  <div class="app" role="application" aria-label="Segway ZT3 Dashboard">
    <header>
      <h1>Segway ZT3 Dashboard</h1>
      <div class="controls">
        <button id="scanBtn" class="primary">Scan and Connect</button>
        <button id="disconnectBtn">Disconnect</button>
        <div class="toggle">
          <label class="small">mph</label>
          <input type="checkbox" id="unitSpeed" aria-label="Toggle mph" />
        </div>
        <div class="toggle">
          <label class="small">°F</label>
          <input type="checkbox" id="unitTemp" aria-label="Toggle Fahrenheit" />
        </div>
      </div>
    </header>

    <div class="banner" id="banner">
      <div id="statusDot" class="status-dot" style="background:var(--danger)"></div>
      <div class="status-text" id="statusText">Disconnected</div>
      <div style="flex:1"></div>
      <div class="small" id="deviceName">No device</div>
    </div>

    <main>
      <div style="text-align:center">
        <div class="speed" id="speedDisplay">--</div>
        <div class="unit" id="speedUnit">km/h</div>
      </div>

      <div class="row">
        <div class="card" style="flex:1;min-width:260px">
          <div class="small">Battery</div>
          <div style="height:8px"></div>
          <div class="battery-bar" aria-hidden="true">
            <div id="batteryFill" class="battery-fill"></div>
          </div>
          <div style="height:8px"></div>
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div id="batteryText">--%</div>
            <div class="small" id="lastUpdate">Last update --</div>
          </div>
        </div>

        <div class="card">
          <div class="small">Temperature</div>
          <div style="height:8px"></div>
          <div class="temp-box">
            <div id="tempValue" style="font-size:20px">--</div>
            <div class="small" id="tempUnit">°C</div>
          </div>
        </div>

        <div class="card">
          <div class="small">Connection</div>
          <div style="height:8px"></div>
          <div id="rssiText">RSSI --</div>
          <div style="height:8px"></div>
          <div id="errorText" class="small" style="color:var(--danger)"></div>
        </div>
      </div>
    </main>

    <footer>
      <div class="small">Run from a secure origin. Web Bluetooth works in Chromium browsers and requires HTTPS or localhost.</div>
    </footer>
  </div>

  <script>
  // Fixed Web Bluetooth dashboard for Segway ZT3 (single-file)
  // Serve from https or localhost. If you know the service/characteristic UUIDs, set them below.
  const SERVICE_UUID = null; // e.g. '0000xxxx-0000-1000-8000-00805f9b34fb'

  // UI elements
  const scanBtn = document.getElementById('scanBtn');
  const disconnectBtn = document.getElementById('disconnectBtn');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const deviceNameEl = document.getElementById('deviceName');
  const speedDisplay = document.getElementById('speedDisplay');
  const speedUnit = document.getElementById('speedUnit');
  const batteryFill = document.getElementById('batteryFill');
  const batteryText = document.getElementById('batteryText');
  const tempValue = document.getElementById('tempValue');
  const tempUnit = document.getElementById('tempUnit');
  const lastUpdate = document.getElementById('lastUpdate');
  const rssiText = document.getElementById('rssiText');
  const errorText = document.getElementById('errorText');
  const unitSpeed = document.getElementById('unitSpeed');
  const unitTemp = document.getElementById('unitTemp');

  // State
  let device = null;
  let server = null;
  let telemetryChar = null;
  let reconnectAttempts = 0;
  let userDisconnected = false;
  let lastValidTelemetry = null;
  let parseErrorCount = 0;
  let updateTimer = null;
  let latestRaw = null;
  let adaptiveInterval = 100; // ms target ~10Hz
  const stationaryThresholdKmh = 1.0;

  // UI helpers
  function setStatus(state, name = '') {
    deviceNameEl.textContent = name || 'No device';
    statusText.textContent = state;
    if (state === 'Connected') {
      statusDot.style.background = 'var(--accent)';
    } else if (state === 'Connecting') {
      statusDot.style.background = '#ffb300';
    } else {
      statusDot.style.background = 'var(--danger)';
    }
  }

  function setError(msg) {
    errorText.textContent = msg || '';
  }

  function formatSpeed(kmh) {
    if (kmh == null) return '--';
    if (unitSpeed.checked) {
      const mph = kmh * 0.621371;
      return mph.toFixed(1);
    } else {
      return kmh.toFixed(1);
    }
  }

  function formatTemp(c) {
    if (c == null) return '--';
    if (unitTemp.checked) {
      const f = c * 9/5 + 32;
      return f.toFixed(1);
    } else {
      return c.toFixed(1);
    }
  }
