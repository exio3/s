<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Segway ZT3 Dashboard</title>
  <style>
    :root{
      --bg:#000; --fg:#fff; --muted:#bdbdbd; --accent:#00e676; --danger:#ff5252; --panel:#111;
    }
    html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:Inter,Segoe UI,Roboto,Arial,sans-serif}
    .app{display:flex;flex-direction:column;height:100%}
    header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:linear-gradient(180deg,#0b0b0b,#111);border-bottom:1px solid #222}
    header h1{font-size:18px;margin:0;font-weight:600}
    .controls{display:flex;gap:8px;align-items:center}
    button{background:#222;color:var(--fg);border:1px solid #333;padding:8px 12px;border-radius:8px;cursor:pointer}
    button.primary{background:var(--accent);color:#000;border:none}
    .banner{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(255,255,255,0.02);border-bottom:1px solid #222}
    .status-dot{width:12px;height:12px;border-radius:50%}
    .status-text{font-weight:600}
    main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px}
    .speed{font-size:96px;font-weight:800;letter-spacing: -2px}
    .unit{font-size:20px;color:var(--muted);margin-top:6px}
    .row{display:flex;gap:20px;align-items:center;margin-top:28px;flex-wrap:wrap}
    .card{background:var(--panel);padding:12px;border-radius:12px;min-width:180px}
    .battery-bar{width:220px;height:14px;background:#222;border-radius:8px;overflow:hidden}
    .battery-fill{height:100%;background:linear-gradient(90deg,var(--accent),#66ffa6);width:0%}
    .temp-box{padding:8px 12px;border-radius:8px;background:#0f0f0f;text-align:center}
    .small{font-size:13px;color:var(--muted)}
    footer{padding:10px 16px;text-align:center;color:var(--muted);font-size:13px}
    .warning{color:var(--danger);font-weight:700}
    .toggle{display:flex;align-items:center;gap:8px}
    @media (max-width:520px){ .speed{font-size:64px} .battery-bar{width:160px} }
  </style>
</head>
<body>
  <div class="app" role="application" aria-label="Segway ZT3 Dashboard">
    <header>
      <h1>Segway ZT3 Dashboard</h1>
      <div class="controls">
        <button id="scanBtn" class="primary">Scan & Connect</button>
        <button id="disconnectBtn">Disconnect</button>
        <div class="toggle"><label class="small">mph</label><input type="checkbox" id="unitSpeed" /></div>
        <div class="toggle"><label class="small">°F</label><input type="checkbox" id="unitTemp" /></div>
      </div>
    </header>

    <div class="banner" id="banner">
      <div id="statusDot" class="status-dot" style="background:var(--danger)"></div>
      <div class="status-text" id="statusText">Disconnected</div>
      <div style="flex:1"></div>
      <div class="small" id="deviceName">No device</div>
    </div>

    <main>
      <div style="text-align:center">
        <div class="speed" id="speedDisplay">--</div>
        <div class="unit" id="speedUnit">km/h</div>
      </div>

      <div class="row">
        <div class="card" style="flex:1;min-width:260px">
          <div class="small">Battery</div>
          <div style="height:8px"></div>
          <div class="battery-bar" aria-hidden="true"><div id="batteryFill" class="battery-fill"></div></div>
          <div style="height:8px"></div>
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div id="batteryText">--%</div>
            <div class="small" id="lastUpdate">Last update --</div>
          </div>
        </div>

        <div class="card">
          <div class="small">Temperature</div>
          <div style="height:8px"></div>
          <div class="temp-box"><div id="tempValue" style="font-size:20px">--</div><div class="small" id="tempUnit">°C</div></div>
        </div>

        <div class="card">
          <div class="small">Connection</div>
          <div style="height:8px"></div>
          <div id="rssiText">RSSI --</div>
          <div style="height:8px"></div>
          <div id="errorText" class="small" style="color:var(--danger)"></div>
        </div>
      </div>
    </main>

    <footer><div class="small">Serve from HTTPS or localhost. Web Bluetooth works in Chromium-based browsers.</div></footer>
  </div>

  <script>
  // Single-file Web Bluetooth dashboard with defensive, error-free patterns.
  // Set these if you know the scooter's UUIDs:
  const SERVICE_UUID = null; // e.g. '0000xxxx-0000-1000-8000-00805f9b34fb'
  const TELEMETRY_CHAR_UUID = null; // e.g. '0000yyyy-0000-1000-8000-00805f9b34fb'

  // UI refs
  const scanBtn = document.getElementById('scanBtn');
  const disconnectBtn = document.getElementById('disconnectBtn');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const deviceNameEl = document.getElementById('deviceName');
  const speedDisplay = document.getElementById('speedDisplay');
  const speedUnit = document.getElementById('speedUnit');
  const batteryFill = document.getElementById('batteryFill');
  const batteryText = document.getElementById('batteryText');
  const tempValue = document.getElementById('tempValue');
  const tempUnit = document.getElementById('tempUnit');
  const lastUpdate = document.getElementById('lastUpdate');
  const rssiText = document.getElementById('rssiText');
  const errorText = document.getElementById('errorText');
  const unitSpeed = document.getElementById('unitSpeed');
  const unitTemp = document.getElementById('unitTemp');

  // State
  let device = null;
  let server = null;
  let telemetryChar = null;
  let reconnectTimer = null;
  let reconnectAttempts = 0;
  let userDisconnected = false;
  let latestRaw = null;
  let lastValidTelemetry = null;
  let parseErrorCount = 0;
  let updateIntervalMs = 100; // target 10Hz
  let updateTimerId = null;
  const stationaryThresholdKmh = 1.0;

  // Logging helpers
  const log = (...a) => console.log('[ZT3]', ...a);
  const warn = (...a) => console.warn('[ZT3]', ...a);
  const error = (...a) => console.error('[ZT3]', ...a);

  // UI helpers
  function setStatus(text, name='') {
    deviceNameEl.textContent = name || 'No device';
    statusText.textContent = text;
    if (text === 'Connected') statusDot.style.background = 'var(--accent)';
    else if (text === 'Connecting') statusDot.style.background = '#ffb300';
    else statusDot.style.background = 'var(--danger)';
  }
  function setError(msg){ errorText.textContent = msg || ''; }

  function formatSpeed(kmh){
    if (kmh == null) return '--';
    return unitSpeed.checked ? (kmh * 0.621371).toFixed(1) : kmh.toFixed(1);
  }
  function formatTemp(c){
    if (c == null) return '--';
    return unitTemp.checked ? (c * 9/5 + 32).toFixed(1) : c.toFixed(1);
  }

  // Defensive parser (example). Replace with real packet format if available.
  function parseTelemetry(bytes){
    if (!bytes || bytes.length < 6) throw new Error('Packet too short');
    const b = (bytes instanceof Uint8Array) ? bytes : new Uint8Array(bytes);
    if (b[0] !== 0xAA) throw new Error('Invalid header');
    let sum = 0;
    for (let i=0;i<b.length-1;i++) sum = (sum + b[i]) & 0xFF;
    if (sum !== b[b.length-1]) throw new Error('Checksum mismatch');
    const speedRaw = (b[2] << 8) | b[1];
    const speedKmh = speedRaw / 100.0;
    const battery = b[3];
    let tempSigned = b[4];
    if (tempSigned > 127) tempSigned -= 256;
    const tempC = tempSigned;
    const validSpeed = (speedKmh >= 0 && speedKmh <= 200) ? speedKmh : null;
    const validBattery = (battery >= 0 && battery <= 100) ? battery : null;
    const validTemp = (tempC >= -40 && tempC <= 120) ? tempC : null;
    return { speedKmh: validSpeed, batteryPercent: validBattery, temperatureC: validTemp, timestamp: new Date() };
  }

  function updateUI(t){
    if (!t) return;
    lastValidTelemetry = t;
    speedDisplay.textContent = formatSpeed(t.speedKmh);
    speedUnit.textContent = unitSpeed.checked ? 'mph' : 'km/h';
    batteryText.textContent = (t.batteryPercent != null) ? `${t.batteryPercent}%` : '--';
    batteryFill.style.width = (t.batteryPercent != null) ? `${t.batteryPercent}%` : '0%';
    batteryFill.style.background = (t.batteryPercent != null && t.batteryPercent > 20) ? 'linear-gradient(90deg,var(--accent),#66ffa6)' : 'linear-gradient(90deg,var(--danger),#ff8a80)';
    tempValue.textContent = formatTemp(t.temperatureC);
    tempUnit.textContent = unitTemp.checked ? '°F' : '°C';
    lastUpdate.textContent = `Last update ${t.timestamp.toLocaleTimeString()}`;
    rssiText.textContent = `RSSI --`;
  }

  // Periodic consumer that processes latestRaw at a controlled rate
  function startUpdateTimer(){
    if (updateTimerId !== null) clearInterval(updateTimerId);
    updateTimerId = setInterval(() => {
      if (!latestRaw) return;
      try {
        const parsed = parseTelemetry(latestRaw);
        updateUI(parsed);
        // adaptive rate
        const speed = parsed.speedKmh ?? 0;
        const desired = (speed < stationaryThresholdKmh) ? 1000 : 100;
        if (desired !== updateIntervalMs) {
          updateIntervalMs = desired;
          clearInterval(updateTimerId);
          startUpdateTimer();
        }
      } catch (e) {
        parseErrorCount++;
        warn('Parse error', e && e.message ? e.message : e);
        setError(`Parse errors: ${parseErrorCount}`);
      } finally {
        latestRaw = null;
      }
    }, updateIntervalMs);
  }

  // Notification handler (kept as stable reference)
  function onCharacteristicValueChanged(event){
    try {
      const dv = event.target && event.target.value ? event.target.value : null;
      if (!dv) return;
      const arr = new Uint8Array(dv.buffer.slice(dv.byteOffset, dv.byteOffset + dv.byteLength));
      latestRaw = arr;
    } catch (e) {
      warn('Notification handler error', e && e.message ? e.message : e);
    }
  }

  // Connect & subscribe
  async function connectAndSubscribe(selectedDevice){
    try {
      setStatus('Connecting', selectedDevice.name || selectedDevice.id);
      device = selectedDevice;
      deviceNameEl.textContent = device.name || device.id;

      // Ensure event listener for disconnect is attached once
      try { device.removeEventListener('gattserverdisconnected', onDisconnected); } catch(e){}
      device.addEventListener('gattserverdisconnected', onDisconnected);

      if (!device.gatt) throw new Error('GATT not available on device');
      server = await device.gatt.connect();
      setStatus('Connected', device.name || device.id);
      reconnectAttempts = 0;
      setError('');

      // Try direct lookup if UUIDs known
      let char = null;
      if (SERVICE_UUID && TELEMETRY_CHAR_UUID) {
        try {
          const svc = await server.getPrimaryService(SERVICE_UUID);
          char = await svc.getCharacteristic(TELEMETRY_CHAR_UUID);
        } catch (e) {
          warn('Direct service/char lookup failed', e && e.message ? e.message : e);
        }
      }

      // Fallback: find first notifiable characteristic
      if (!char) {
        const services = await server.getPrimaryServices();
        for (const s of services) {
          try {
            const chars = await s.getCharacteristics();
            for (const c of chars) {
              if (c.properties && (c.properties.notify || c.properties.indicate)) {
                char = c;
                break;
              }
            }
            if (char) break;
          } catch (e) {
            warn('Characteristic discovery error', e && e.message ? e.message : e);
          }
        }
      }

      if (!char) {
        setError('Telemetry characteristic not found');
        return;
      }

      telemetryChar = char;

      // Remove previous listener safely
      try { telemetryChar.removeEventListener('characteristicvaluechanged', onCharacteristicValueChanged); } catch(e){}

      await telemetryChar.startNotifications();
      telemetryChar.addEventListener('characteristicvaluechanged', onCharacteristicValueChanged);
      log('Subscribed to telemetry notifications');

      if (updateTimerId === null) startUpdateTimer();
    } catch (e) {
      error('connectAndSubscribe failed', e && e.message ? e.message : e);
      setError('Connection failed');
      setStatus('Disconnected');
      scheduleReconnect();
    }
  }

  function onDisconnected(){
    setStatus('Disconnected');
    setError('Device disconnected');
    log('Device disconnected');
    if (!userDisconnected) scheduleReconnect();
  }

  function computeBackoff(attempts){
    if (attempts <= 3) return attempts * 1000;
    if (attempts <= 6) return (attempts - 2) * 5000;
    return 30000;
  }

  function scheduleReconnect(){
    reconnectAttempts++;
    const backoff = computeBackoff(reconnectAttempts);
    setError(`Reconnecting in ${Math.round(backoff/1000)}s`);
    if (reconnectTimer) clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(async () => {
      if (!device) return;
      try {
        if (device.gatt && !device.gatt.connected) {
          await connectAndSubscribe(device);
        } else if (device.gatt && device.gatt.connected) {
          log('Already connected');
        } else {
          warn('Automatic reconnect unavailable; press Scan & Connect');
          setError('Automatic reconnect unavailable; press Scan & Connect');
        }
      } catch (e) {
        warn('Reconnect attempt failed', e && e.message ? e.message : e);
        scheduleReconnect();
      }
    }, backoff);
  }

  // Request device and start connection
  async function startScanAndConnect(){
    try {
      if (!navigator.bluetooth) {
        setError('Web Bluetooth not supported');
        return;
      }
      userDisconnected = false;
      setError('');
      setStatus('Scanning');
      const options = {};
      if (SERVICE_UUID) {
        options.filters = [{ services: [SERVICE_UUID] }];
        options.optionalServices = [SERVICE_UUID];
      } else {
        options.acceptAllDevices = true;
      }
      const dev = await navigator.bluetooth.requestDevice(options);
      if (!dev) {
        setStatus('Disconnected');
        return;
      }
      await connectAndSubscribe(dev);
    } catch (e) {
      warn('startScanAndConnect error', e && e.message ? e.message : e);
      setStatus('Disconnected');
      setError(e && e.message ? e.message : 'Scan/connect failed');
    }
  }

  // Graceful disconnect
  async function disconnect(){
    userDisconnected = true;
    setError('');
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    try {
      if (telemetryChar) {
        try { await telemetryChar.stopNotifications(); } catch(e){ warn('stopNotifications failed', e); }
        try { telemetryChar.removeEventListener('characteristicvaluechanged', onCharacteristicValueChanged); } catch(e){}
        telemetryChar = null;
      }
      if (device && device.gatt && device.gatt.connected) {
        try { device.gatt.disconnect(); } catch(e){ warn('gatt.disconnect failed', e); }
      }
    } catch (e) {
      warn('disconnect error', e && e.message ? e.message : e);
    } finally {
      device = null;
      server = null;
      setStatus('Disconnected');
    }
  }

  // UI wiring
  scanBtn.addEventListener('click', async () => { await startScanAndConnect(); });
  disconnectBtn.addEventListener('click', async () => { await disconnect(); });

  unitSpeed.addEventListener('change', () => {
    speedDisplay.textContent = formatSpeed(lastValidTelemetry?.speedKmh);
    speedUnit.textContent = unitSpeed.checked ? 'mph' : 'km/h';
    localStorage.setItem('useMph', unitSpeed.checked ? '1' : '0');
  });
  unitTemp.addEventListener('change', () => {
    tempValue.textContent = formatTemp(lastValidTelemetry?.temperatureC);
    tempUnit.textContent = unitTemp.checked ? '°F' : '°C';
    localStorage.setItem('useF', unitTemp.checked ? '1' : '0');
  });

  // Load prefs
  (function loadPrefs(){
    try {
      const m = localStorage.getItem('useMph');
      const t = localStorage.getItem('useF');
      if (m === '1') unitSpeed.checked = true;
      if (t === '1') unitTemp.checked = true;
    } catch (e) { /* ignore storage errors */ }
  })();

  // Init
  (function init(){
    setStatus('Disconnected');
    if (!navigator.bluetooth) {
      setError('Web Bluetooth not supported in this browser');
      scanBtn.disabled = true;
    } else {
      log('Web Bluetooth available');
    }
    // Start timer so UI updates are controlled even before connection
    startUpdateTimer();
  })();

  </script>
</body>
</html>
